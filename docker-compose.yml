services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: taskapi_dev_password
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://taskapi:taskapi_dev_password@db:5432/tasks
    ports:
      - "3000:3000"

volumes:
  pgdata: